[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "protocol-tree-node-whatsapp"
version = "0.1.0"
description = "Pure Python WhatsApp WABinary / Protocol Tree Node serializer and deserializer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
keywords = [
    "whatsapp",
    "whatsapp-protocol",
    "protocol-tree-node",
    "wabinary",
    "binary-protocol",
    "binary-xml",
    "serialization",
    "deserialization",
    "binary-parser",
    "token-dictionary",
]

[project.urls]
Repository = "https://github.com/WhatsappWiki/protocol-tree-node-whatsapp"
Issues = "https://github.com/WhatsappWiki/protocol-tree-node-whatsapp/issues"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
protocol_tree_node = ["data/*.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
